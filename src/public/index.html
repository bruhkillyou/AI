<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uživatelský systém</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <nav id="nav-bar">
            <div class="nav-links">
                <button id="showLogin">Přihlášení</button>
                <button id="showRegister">Registrace</button>
                <button id="showProfile" style="display: none;">Profil</button>
                <button id="logout" style="display: none;">Odhlásit</button>
            </div>
        </nav>

        <main>
            <!-- Login Form -->
            <div id="loginForm" class="form-container">
                <h2>Přihlášení</h2>
                <form id="login">
                    <div class="form-group">
                        <label for="loginEmail">Email:</label>
                        <input type="email" id="loginEmail" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Heslo:</label>
                        <input type="password" id="loginPassword" required>
                    </div>
                    <button type="submit">Přihlásit</button>
                </form>
            </div>

            <!-- Register Form -->
            <div id="registerForm" class="form-container" style="display: none;">
                <h2>Registrace</h2>
                <form id="register">
                    <div class="form-group">
                        <label for="registerUsername">Uživatelské jméno:</label>
                        <input type="text" id="registerUsername" required>
                    </div>
                    <div class="form-group">
                        <label for="registerEmail">Email:</label>
                        <input type="email" id="registerEmail" required>
                    </div>
                    <div class="form-group">
                        <label for="registerPassword">Heslo:</label>
                        <input type="password" id="registerPassword" required>
                    </div>
                    <button type="submit">Registrovat</button>
                </form>
            </div>

            <!-- Profile Section -->
            <div id="profileSection" class="profile-container" style="display: none;">
                <h2>Můj profil</h2>
                <div id="profileInfo">
                    <p>Uživatelské jméno: <span id="profileUsername"></span></p>
                    <p>Email: <span id="profileEmail"></span></p>
                </div>
                <button id="deleteAccount" class="danger">Smazat účet</button>
            </div>
        </main>
    </div>
    <script src="/js/main.js"></script>
</body>
</html>
